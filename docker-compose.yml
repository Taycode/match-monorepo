version: '3.8'

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: match
      POSTGRES_USER: match
      POSTGRES_PASSWORD: match
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: 
      context: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/code
      - /code/.venv  # Anonymous volume - excludes .venv from host mount
      - /code/__pycache__  # Anonymous volume - excludes Python cache
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules  # Anonymous volume - excludes node_modules from host mount
      - /app/dist  # Anonymous volume - excludes build artifacts
    environment:
      - NODE_ENV=development
    depends_on:
      - server

volumes:
  postgres_data:
